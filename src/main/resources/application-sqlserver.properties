# ===================================================================
# CẤU HÌNH KẾT NỐI MICROSOFT SQL SERVER (MEDCLINIC)
# ===================================================================

# 1. Cấu hình Data Source
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=medclinic_db;encrypt=false;trustServerCertificate=true;sendStringParametersAsUnicode=true}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 2. Cấu hình JPA & Hibernate cho SQL Server
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.use_nationalized_character_data=true

# 3. Cho phép tự động nạp dữ liệu mẫu (Seed Data)
spring.jpa.defer-datasource-initialization=true
