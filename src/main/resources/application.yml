spring:
  application:
    name: medclinic-system
  profiles:
    active: dev

  flyway:
    enabled: false

  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25

  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
      show-components: never
  health:
    mail:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}

app:
  name: MedClinic - Phòng Khám Đa Khoa Tư Nhân
  address: 123 Đường Nguyễn Trãi, Quận 5, TP. Hồ Chí Minh
  hotline: 1900 6868
  email: support@medclinic.vn
  website: ${APP_WEBSITE:http://localhost:8080}
  auth:
    otp-validity-seconds: ${AUTH_OTP_VALIDITY_SECONDS:300}
  mail-delivery:
    max-attempts: ${EMAIL_MAX_ATTEMPTS:3}
    retry-backoff-ms: ${EMAIL_RETRY_BACKOFF_MS:250}
  payment:
    bank:
      enabled: ${BANK_PAYMENT_ENABLED:false}
      bank-id: ${BANK_PAYMENT_BANK_ID:970422}
      bank-name: ${BANK_PAYMENT_BANK_NAME:MB Bank}
      account-no: ${BANK_PAYMENT_ACCOUNT_NO:}
      account-name: ${BANK_PAYMENT_ACCOUNT_NAME:}
      qr-template: ${BANK_PAYMENT_QR_TEMPLATE:compact2}
      callback-secret: ${BANK_PAYMENT_CALLBACK_SECRET:}
      expiry-minutes: ${BANK_PAYMENT_EXPIRY_MINUTES:30}
  storage:
    avatar-dir: ${AVATAR_STORAGE_DIR:uploads/avatars}
  retention:
    auth-token-days: ${AUTH_TOKEN_RETENTION_DAYS:7}
    audit-days: ${BUSINESS_AUDIT_RETENTION_DAYS:1825}
    cleanup-cron: ${DATA_RETENTION_CLEANUP_CRON:0 30 2 * * *}
  security:
    # Production profiles must supply this via REMEMBER_ME_KEY or an external config source.
    remember-me-key: ${REMEMBER_ME_KEY}
    rate-limit:
      store: ${AUTH_RATE_LIMIT_STORE:memory}
      login-max-requests: ${LOGIN_RATE_LIMIT_MAX:20}
      password-reset-max-requests: ${PASSWORD_RESET_RATE_LIMIT_MAX:5}
      payment-callback-max-requests: ${PAYMENT_CALLBACK_RATE_LIMIT_MAX:60}
      window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:300}

---
# Development Profile (H2 In-Memory for Instant Zero-Config Run)
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:medclinic_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true

app:
  security:
    # Local H2 data is ephemeral; production never receives a checked-in key.
    remember-me-key: dev-only-replace-before-deploy

---
# MySQL Production / Local Profile
spring:
  config:
    activate:
      on-profile: mysql

  datasource:
    url: jdbc:mysql://localhost:3306/medclinic_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect

---
# SQL Server Profile (Primary Production / Local Database)
spring:
  config:
    activate:
      on-profile: sqlserver

  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=medclinic_db;encrypt=false;trustServerCertificate=true;sendStringParametersAsUnicode=true;}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  flyway:
    enabled: true
    locations: classpath:db/migration/sqlserver
    baseline-on-migrate: false
    baseline-version: 1
    baseline-description: Legacy SQL Server schema
    validate-on-migrate: true
    clean-disabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.SQLServerDialect
    defer-datasource-initialization: false
    properties:
      hibernate:
        use_nationalized_character_data: true

app:
  security:
    rate-limit:
      store: ${AUTH_RATE_LIMIT_STORE:jdbc}

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:true}

---
# Production hardening is activated together with the database profile: sqlserver,prod.
spring:
  config:
    activate:
      on-profile: prod
  thymeleaf:
    cache: true
  h2:
    console:
      enabled: false

server:
  shutdown: graceful
  servlet:
    session:
      cookie:
        secure: true

management:
  endpoint:
    health:
      probes:
        enabled: true
