<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" class="mc-brand-emblem" aria-hidden="true">
  <defs>
    <linearGradient id="mcBrandGrad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="55%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="mcCrossGrad" x1="18" y1="6" x2="30" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Stylized "M" Outer Geometry with rounded strokes -->
  <path d="M10 38V18C10 14 13 11 17 11H20" stroke="url(#mcBrandGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M28 11H31C35 11 38 14 38 18V38" stroke="url(#mcBrandGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M10 38H16" stroke="url(#mcBrandGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M32 38H38" stroke="url(#mcBrandGrad)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Medical Cross Top Center -->
  <rect x="21" y="4" width="6" height="14" rx="2" fill="url(#mcCrossGrad)" />
  <rect x="17" y="8" width="14" height="6" rx="2" fill="url(#mcCrossGrad)" />

  <!-- Heartbeat ECG Pulse Wave (Life & Vitality) -->
  <path d="M7 26H17L20 33L24 16L27 30L29 26H41"
        stroke="url(#mcBrandGrad)"
        stroke-width="3.2"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Healing Leaf / Caring Curve at Bottom Right -->
  <path d="M24 37C27 40 33 40 37 36C38 31 34 27 28 29C28 34 26 36 24 37Z"
        fill="url(#mcBrandGrad)"
        opacity="0.9" />
</svg>
