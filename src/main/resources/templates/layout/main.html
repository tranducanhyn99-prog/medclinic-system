<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - MedClinic">MedClinic - Phòng Khám Đa Khoa Tư Nhân</title>
    
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- SweetAlert2 -->
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.6/dist/sweetalert2.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-color: #0284c7;
            --primary-hover: #0369a1;
            --dark-navy: #0f172a;
            --light-bg: #f8fafc;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--light-bg);
            color: #334155;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar-med {
            background-color: #ffffff;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
        }
        .btn-med-primary {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #ffffff;
            border: none;
            font-weight: 600;
            padding: 0.5rem 1.25rem;
            border-radius: 0.5rem;
            box-shadow: 0 2px 4px rgba(2, 132, 199, 0.25);
            transition: all 0.2s ease;
        }
        .btn-med-primary:hover {
            background: linear-gradient(135deg, #0369a1 0%, #075985 100%);
            color: #ffffff;
            transform: translateY(-1px);
        }
        .card-custom {
            border: none;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .footer-med {
            background-color: var(--dark-navy);
            color: #94a3b8;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <!-- Header Navbar -->
    <nav class="navbar navbar-expand-lg navbar-med sticky-top py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center fw-bold fs-4 text-primary" th:href="@{/}">
                <i class="bi bi-hospital-fill me-2 fs-3 text-info"></i>
                <span>Med<span class="text-dark">Clinic</span></span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMain">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                    <li class="nav-item">
                        <a class="nav-link fw-semibold" th:href="@{/}">Trang chủ</a>
                    </li>
                </ul>

                <div class="d-flex align-items-center gap-2">
                    <div sec:authorize="!isAuthenticated()" class="d-flex gap-2">
                        <a th:href="@{/login}" class="btn btn-outline-primary fw-semibold px-3">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Đăng nhập
                        </a>
                        <a th:href="@{/register}" class="btn btn-med-primary px-3">
                            <i class="bi bi-person-plus-fill me-1"></i> Đăng ký khám
                        </a>
                    </div>

                    <div sec:authorize="isAuthenticated()" class="dropdown">
                        <button class="btn btn-light border dropdown-toggle d-flex align-items-center gap-2 px-3 py-2" type="button" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle fs-5 text-primary"></i>
                            <span class="fw-semibold" sec:authentication="name">User</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2">
                            <li><a class="dropdown-item py-2" th:href="@{/profile}"><i class="bi bi-person-gear me-2"></i> Hồ sơ cá nhân</a></li>
                            <li sec:authorize="hasRole('ADMIN')"><a class="dropdown-item py-2 text-danger" th:href="@{/admin/dashboard}"><i class="bi bi-speedometer2 me-2"></i> Admin Portal</a></li>
                            <li sec:authorize="hasRole('DOCTOR')"><a class="dropdown-item py-2 text-success" th:href="@{/doctor/desk}"><i class="bi bi-heart-pulse me-2"></i> Bàn khám Bác sĩ</a></li>
                            <li sec:authorize="hasRole('STAFF')"><a class="dropdown-item py-2 text-warning" th:href="@{/staff/reception}"><i class="bi bi-calendar-check me-2"></i> Quầy tiếp nhận</a></li>
                            <li sec:authorize="hasRole('PATIENT')"><a class="dropdown-item py-2 text-primary" th:href="@{/patient/appointments}"><i class="bi bi-calendar3 me-2"></i> Lịch hẹn của tôi</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <form th:action="@{/logout}" method="post">
                                    <button type="submit" class="dropdown-item py-2 text-danger">
                                        <i class="bi bi-box-arrow-right me-2"></i> Đăng xuất
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow-1">
        <div class="container py-3">
            <div th:replace="~{fragments/alerts :: alerts}"></div>
        </div>
        <div layout:fragment="content"></div>
    </main>

    <!-- Footer -->
    <footer class="footer-med py-4 mt-5">
        <div class="container text-center small">
            <p class="mb-1 fw-bold text-white">MedClinic - Hệ Thống Quản Lý Và Đặt Lịch Khám Phòng Khám Tư Nhân</p>
            <p class="mb-0 text-secondary">Đồ án Lập Trình Web & Công Nghệ Phần Mềm © 2026. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.6/dist/sweetalert2.all.min.js"></script>
    <div layout:fragment="scripts"></div>
</body>
</html>
