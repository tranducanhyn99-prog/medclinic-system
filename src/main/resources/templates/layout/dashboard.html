<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - MedClinic Portal">MedClinic Portal</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.6/dist/sweetalert2.min.css" rel="stylesheet">

    <style>
        :root {
            --sidebar-width: 260px;
            --sidebar-bg: #0f172a;
            --content-bg: #f1f5f9;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--content-bg);
            color: #334155;
        }
        #sidebar-wrapper {
            min-height: 100vh;
            width: var(--sidebar-width);
            background-color: var(--sidebar-bg);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
        }
        .sidebar-brand {
            padding: 1.25rem 1.5rem;
            color: #ffffff;
            font-size: 1.25rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #1e293b;
        }
        #page-content-wrapper {
            margin-left: var(--sidebar-width);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .card-portal {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body>
    <div class="d-flex" id="wrapper">
        <div id="sidebar-wrapper">
            <a th:href="@{/}" class="sidebar-brand text-decoration-none">
                <i class="bi bi-hospital-fill text-info me-2 fs-4"></i>
                <span>Med<span class="text-info">Clinic</span></span>
            </a>
            <div class="p-3 text-muted small">
                <i class="bi bi-gear-fill me-1"></i> Phase 1: Dashboard Layout
            </div>
        </div>

        <div id="page-content-wrapper">
            <div class="container-fluid p-4 flex-grow-1">
                <div th:replace="~{fragments/alerts :: alerts}"></div>
                <div layout:fragment="content"></div>
            </div>
            <footer class="bg-white border-top py-3 text-center text-muted small">
                © 2026 MedClinic System - Đồ án Lập trình Web & Công nghệ Phần mềm.
            </footer>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.6/dist/sweetalert2.all.min.js"></script>
    <div layout:fragment="scripts"></div>
</body>
</html>
