<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Thông Báo Lỗi - MedClinic</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container py-5 text-center">
        <div class="card card-custom p-5 mx-auto border-0 shadow-sm" style="max-width: 600px;">
            <div class="text-danger mb-3">
                <i class="bi bi-exclamation-triangle-fill display-1"></i>
            </div>
            <h1 class="fw-bold mb-2" th:text="${errorCode != null ? errorCode : 'Đã Xảy Ra Lỗi'}">Lỗi</h1>
            <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'Hệ thống gặp sự cố trong quá trình xử lý yêu cầu.'}">Chi tiết lỗi</p>
            <div class="d-flex flex-wrap justify-content-center gap-2">
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/dashboard}" class="btn btn-med-primary px-4 py-2">
                    <i class="bi bi-speedometer2 me-1"></i> Về trang quản trị
                </a>
                <a sec:authorize="hasRole('DOCTOR')" th:href="@{/doctor/desk}" class="btn btn-med-primary px-4 py-2">
                    <i class="bi bi-heart-pulse me-1"></i> Về bàn khám
                </a>
                <a sec:authorize="hasRole('STAFF')" th:href="@{/staff/reception}" class="btn btn-med-primary px-4 py-2">
                    <i class="bi bi-person-check me-1"></i> Về tiếp nhận
                </a>
                <a sec:authorize="hasRole('PATIENT')" th:href="@{/patient/appointments}" class="btn btn-med-primary px-4 py-2">
                    <i class="bi bi-calendar-check me-1"></i> Về lịch hẹn
                </a>
                <a sec:authorize="isAnonymous()" th:href="@{/login}" class="btn btn-med-primary px-4 py-2">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Đăng nhập
                </a>
                <a th:href="@{/}" class="btn btn-outline-secondary px-4 py-2">
                    <i class="bi bi-house-fill me-1"></i> Về trang chủ
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
