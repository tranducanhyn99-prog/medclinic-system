<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head><title>Khôi phục mật khẩu - MedClinic</title></head>
<body>
<div layout:fragment="content">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card card-custom p-4 p-md-5 border-0 shadow">
                    <div class="text-center mb-4">
                        <i class="bi bi-envelope-lock fs-1 text-primary"></i>
                        <h3 class="fw-bold mt-2">Khôi phục mật khẩu</h3>
                        <p class="text-muted small">Nhập email đăng ký để nhận liên kết đặt lại mật khẩu.</p>
                    </div>
                    <form th:action="@{/forgot-password}" method="post">
                        <label class="form-label">Email đăng ký</label>
                        <input type="email" name="email" class="form-control form-control-lg" required autofocus>
                        <button class="btn btn-med-primary w-100 py-3 fw-bold mt-4" type="submit">Gửi liên kết khôi phục</button>
                    </form>
                    <div class="text-center small mt-4"><a th:href="@{/login}">Quay lại đăng nhập</a></div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
