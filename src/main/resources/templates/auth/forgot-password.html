<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head><title>Khôi phục mật khẩu - MedClinic</title></head>
<body>
<div layout:fragment="content">
    <div class="container">
        <section class="mc-auth-section" aria-labelledby="forgotTitle">
            <div class="mc-auth-single mc-auth-narrow">
                <div class="mc-auth-icon"><i class="bi bi-envelope"></i></div>
                <div class="mc-auth-eyebrow">Khôi phục tài khoản</div>
                <h1 class="mc-auth-title" id="forgotTitle">Quên mật khẩu?</h1>
                <p class="mc-auth-subtitle">Nhập email đã đăng ký. Nếu tài khoản hợp lệ, hệ thống sẽ gửi hướng dẫn đặt lại mật khẩu.</p>

                <form th:action="@{/forgot-password}" method="post" class="mc-auth-form">
                    <div class="mb-3">
                        <label class="form-label" for="recoveryEmail">Email đăng ký</label>
                        <input id="recoveryEmail" type="email" name="email" class="form-control"
                               placeholder="email@example.com" autocomplete="email" required autofocus>
                    </div>
                    <button class="btn btn-med-primary mc-auth-submit" type="submit">
                        <i class="bi bi-send me-2"></i>Gửi liên kết khôi phục
                    </button>
                </form>
                <div class="mc-auth-links"><a th:href="@{/login}"><i class="bi bi-arrow-left me-1"></i>Quay lại đăng nhập</a></div>
            </div>
        </section>
    </div>
</div>
</body>
</html>
