<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Đăng Ký Khám - MedClinic</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-7">
                <div class="card card-custom p-4 p-md-5 border-0 shadow">
                    <div class="text-center mb-4">
                        <div class="rounded-circle bg-primary bg-opacity-10 text-primary p-3 d-inline-flex align-items-center justify-content-center mb-2" style="width: 70px; height: 70px;">
                            <i class="bi bi-person-plus-fill fs-1"></i>
                        </div>
                        <h3 class="fw-bold text-dark mb-1">Đăng Ký Tài Khoản Bệnh Nhân</h3>
                        <p class="text-muted small">Tạo hồ sơ bệnh nhân điện tử để đặt lịch khám nhanh chóng</p>
                    </div>

                    <form th:action="@{/register}" th:object="${registerDto}" method="post">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold text-muted">Họ và tên <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{fullName}" class="form-control" th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'" placeholder="Ví dụ: Nguyễn Văn An">
                                <div class="invalid-feedback" th:errors="*{fullName}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label small fw-semibold text-muted">Tên đăng nhập <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{username}" class="form-control" th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'" placeholder="Ít nhất 3 ký tự">
                                <div class="invalid-feedback" th:errors="*{username}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label small fw-semibold text-muted">Mật khẩu <span class="text-danger">*</span></label>
                                <input type="password" th:field="*{password}" class="form-control" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" placeholder="Ít nhất 6 ký tự">
                                <div class="invalid-feedback" th:errors="*{password}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label small fw-semibold text-muted">Xác nhận mật khẩu <span class="text-danger">*</span></label>
                                <input type="password" th:field="*{confirmPassword}" class="form-control" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'" placeholder="Nhập lại mật khẩu">
                                <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label small fw-semibold text-muted">Email <span class="text-danger">*</span></label>
                                <input type="email" th:field="*{email}" class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" placeholder="email@example.com">
                                <div class="invalid-feedback" th:errors="*{email}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label small fw-semibold text-muted">Số điện thoại <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{phone}" class="form-control" th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'" placeholder="0901234567">
                                <div class="invalid-feedback" th:errors="*{phone}"></div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label small fw-semibold text-muted">Giới tính</label>
                                <select th:field="*{gender}" class="form-select">
                                    <option th:value="${T(com.medclinic.enums.Gender).MALE}">Nam</option>
                                    <option th:value="${T(com.medclinic.enums.Gender).FEMALE}">Nữ</option>
                                    <option th:value="${T(com.medclinic.enums.Gender).OTHER}">Khác</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label small fw-semibold text-muted">Ngày sinh</label>
                                <input type="date" th:field="*{dateOfBirth}" class="form-control">
                            </div>

                            <div class="col-12">
                                <label class="form-label small fw-semibold text-muted">Địa chỉ cư trú</label>
                                <input type="text" th:field="*{address}" class="form-control" placeholder="Số nhà, đường, phường/xã, quận/huyện...">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-med-primary w-100 py-3 fw-bold mt-4 mb-3">
                            <i class="bi bi-person-check-fill me-2"></i> Hoàn Tất Đăng Ký
                        </button>

                        <div class="text-center small text-muted">
                            Đã có tài khoản? <a th:href="@{/login}" class="text-primary fw-semibold">Đăng nhập tại đây</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
