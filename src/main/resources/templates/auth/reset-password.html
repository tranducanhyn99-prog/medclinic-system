<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head><title>Đặt lại mật khẩu - MedClinic</title></head>
<body>
<div layout:fragment="content">
    <div class="container">
        <section class="mc-auth-section" aria-labelledby="resetTitle">
            <div class="mc-auth-single mc-auth-narrow">
                <div class="mc-auth-icon"><i class="bi bi-shield-lock"></i></div>
                <div class="mc-auth-eyebrow">Bảo mật tài khoản</div>
                <h1 class="mc-auth-title" id="resetTitle">Đặt lại mật khẩu</h1>
                <p class="mc-auth-subtitle">Tạo mật khẩu mới có ít nhất 6 ký tự và nhập lại để xác nhận.</p>

                <form th:action="@{/reset-password}" method="post" class="mc-auth-form">
                    <input type="hidden" name="token" th:value="${token}">
                    <div class="mb-3">
                        <label class="form-label" for="newPassword">Mật khẩu mới</label>
                        <input id="newPassword" type="password" name="newPassword" class="form-control"
                               minlength="6" autocomplete="new-password" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="confirmPassword">Xác nhận mật khẩu mới</label>
                        <input id="confirmPassword" type="password" name="confirmPassword" class="form-control"
                               minlength="6" autocomplete="new-password" required>
                    </div>
                    <button class="btn btn-med-primary mc-auth-submit" type="submit">
                        <i class="bi bi-check2-circle me-2"></i>Cập nhật mật khẩu
                    </button>
                </form>
                <div class="mc-auth-links"><a th:href="@{/login}">Quay lại đăng nhập</a></div>
            </div>
        </section>
    </div>
</div>
</body>
</html>
