<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Hồ Sơ Cá Nhân - MedClinic</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card card-custom p-4 p-md-5 border-0 shadow mb-4">
                    <div class="d-flex align-items-center mb-4 pb-3 border-bottom">
                        <div class="rounded-circle bg-primary bg-opacity-10 text-primary p-3 d-inline-flex align-items-center justify-content-center me-3" style="width: 60px; height: 60px;">
                            <i class="bi bi-person-badge fs-2"></i>
                        </div>
                        <div>
                            <h4 class="fw-bold mb-1" th:text="${user.fullName}">Nguyễn Văn An</h4>
                            <span class="badge bg-primary px-3 py-1" th:text="${user.role.name.displayName}">Bệnh nhân</span>
                        </div>
                    </div>

                    <form th:action="@{/profile}" method="post" class="mb-5">
                        <h5 class="fw-bold mb-3 text-secondary"><i class="bi bi-info-circle me-2"></i> Thông Tin Cá Nhân</h5>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold text-muted">Tên đăng nhập</label>
                                <input type="text" class="form-control" th:value="${user.username}" disabled readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold text-muted">Email</label>
                                <input type="email" class="form-control" th:value="${user.email}" disabled readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold text-muted">Họ và tên</label>
                                <input type="text" name="fullName" class="form-control" th:value="${user.fullName}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold text-muted">Số điện thoại</label>
                                <input type="text" name="phone" class="form-control" th:value="${user.phone}" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label small fw-semibold text-muted">Địa chỉ</label>
                                <input type="text" name="address" class="form-control" th:value="${user.address}">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-med-primary mt-3">
                            <i class="bi bi-save me-1"></i> Cập Nhật Thông Tin
                        </button>
                    </form>

                    <hr>

                    <form th:action="@{/profile/change-password}" method="post" class="mt-4">
                        <h5 class="fw-bold mb-3 text-secondary"><i class="bi bi-shield-lock me-2"></i> Đổi Mật Khẩu</h5>
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label small fw-semibold text-muted">Mật khẩu hiện tại</label>
                                <input type="password" name="oldPassword" class="form-control" placeholder="Mật khẩu cũ..." required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-semibold text-muted">Mật khẩu mới</label>
                                <input type="password" name="newPassword" class="form-control" placeholder="Tối thiểu 6 ký tự..." required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-semibold text-muted">Xác nhận mật khẩu mới</label>
                                <input type="password" name="confirmPassword" class="form-control" placeholder="Nhập lại mật khẩu mới..." required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-outline-danger mt-3">
                            <i class="bi bi-key-fill me-1"></i> Đổi Mật Khẩu
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
