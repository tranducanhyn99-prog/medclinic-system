services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: medclinic-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Hãy cấu hình MSSQL_SA_PASSWORD trong file .env}
    ports:
      - "127.0.0.1:${SQLSERVER_HOST_PORT:-14333}:1433"
    volumes:
      - medclinic-sqlserver-data:/var/opt/mssql
      - ./docker/sqlserver:/docker:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          SQLCMD=/opt/mssql-tools18/bin/sqlcmd;
          [ -x "$$SQLCMD" ] || SQLCMD=/opt/mssql-tools/bin/sqlcmd;
          "$$SQLCMD" -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: medclinic-sqlserver-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Hãy cấu hình MSSQL_SA_PASSWORD trong file .env}
    volumes:
      - ./docker/sqlserver:/docker:ro
    entrypoint: ["/bin/bash", "/docker/init-db.sh"]
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.31.1
    container_name: medclinic-mailpit
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: medclinic-system:local
    container_name: medclinic-app
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: sqlserver,demo
      DEMO_EARLY_CLINICAL_PROCESSING: ${DEMO_EARLY_CLINICAL_PROCESSING:-true}
      TZ: Asia/Ho_Chi_Minh
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      DB_URL: jdbc:sqlserver://sqlserver:1433;databaseName=medclinic_db;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true
      DB_USERNAME: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD:?Hãy cấu hình MSSQL_SA_PASSWORD trong file .env}
      REMEMBER_ME_KEY: ${REMEMBER_ME_KEY:?Hãy cấu hình REMEMBER_ME_KEY trong file .env}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-20}
      PASSWORD_RESET_RATE_LIMIT_MAX: ${PASSWORD_RESET_RATE_LIMIT_MAX:-5}
      PAYMENT_CALLBACK_RATE_LIMIT_MAX: ${PAYMENT_CALLBACK_RATE_LIMIT_MAX:-60}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-300}
      AUTH_RATE_LIMIT_STORE: ${AUTH_RATE_LIMIT_STORE:-jdbc}
      EMAIL_MAX_ATTEMPTS: ${EMAIL_MAX_ATTEMPTS:-3}
      EMAIL_RETRY_BACKOFF_MS: ${EMAIL_RETRY_BACKOFF_MS:-250}
      BANK_PAYMENT_ENABLED: ${BANK_PAYMENT_ENABLED:-false}
      BANK_PAYMENT_BANK_ID: ${BANK_PAYMENT_BANK_ID:-970422}
      BANK_PAYMENT_BANK_NAME: ${BANK_PAYMENT_BANK_NAME:-MB Bank}
      BANK_PAYMENT_ACCOUNT_NO: ${BANK_PAYMENT_ACCOUNT_NO:-}
      BANK_PAYMENT_ACCOUNT_NAME: ${BANK_PAYMENT_ACCOUNT_NAME:-}
      BANK_PAYMENT_QR_TEMPLATE: ${BANK_PAYMENT_QR_TEMPLATE:-compact2}
      BANK_PAYMENT_CALLBACK_SECRET: ${BANK_PAYMENT_CALLBACK_SECRET:-}
      BANK_PAYMENT_EXPIRY_MINUTES: ${BANK_PAYMENT_EXPIRY_MINUTES:-30}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@medclinic.test}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"
      AVATAR_STORAGE_DIR: /app/uploads/avatars
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - medclinic-uploads:/app/uploads
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  medclinic-sqlserver-data:
  medclinic-uploads:
