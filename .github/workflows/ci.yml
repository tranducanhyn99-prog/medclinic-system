name: CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'docs/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Build, test & JaCoCo
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify project and coverage gates
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify frontend regressions
        run: node --test src/test/frontend/ui-regressions.cjs
      - name: Verify documentation links
        run: node ops/check-doc-links.cjs
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload application package
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: medclinic-jar
          path: target/medclinic-system-*.jar
          if-no-files-found: error
          retention-days: 7
